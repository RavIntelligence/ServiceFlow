<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ServiceFlow</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
<header><div><small>SERVICEFLOW</small><h1>Today</h1></div><button id="addBtn">+</button></header>

<main>
<section id="today" class="page active">
<div id="jobs"></div>
<div id="empty" class="empty">No jobs yet.<br><button onclick="show('add')">Add Job</button></div>
</section>

<section id="add" class="page">
<form id="jobForm">
<label>Customer name<input id="customerName" required></label>
<label>Phone number<input id="phone" required placeholder="+18015551234"></label>
<label>Address<input id="address" required></label>
<label>Job description<input id="description" required></label>
<div class="two"><label>Date<input id="scheduledDate" type="date" required></label><label>Time<input id="scheduledTime" type="time" required></label></div>
<label>Estimated job time (minutes)<input id="estimatedMinutes" type="number" value="60" min="10"></label>
<label>Notes<textarea id="notes"></textarea></label>
<button class="primary">Save Job</button>
</form>
</section>
</main>

<nav><button onclick="show('today')">Today</button><button onclick="show('add')">Add Job</button></nav>
</div>

<dialog id="dlg"><div id="detail"></div><button onclick="dlg.close()">Close</button></dialog>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
